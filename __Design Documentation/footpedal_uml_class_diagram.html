<h2 class="sr-only">UML class diagram of the foot pedal remapper showing core interfaces, the engine and its stages, domain value types, and platform adapters.</h2>
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#uml{padding:1rem 0}
#uml svg{max-width:100%;height:auto}
</style>
<div id="uml"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad:false, theme:'base',
  fontFamily:'"anthropic-sans", sans-serif',
  themeVariables:{ darkMode:dark, fontSize:'13px', fontFamily:'"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a' }
});
const src = `classDiagram
direction TB
class InputDevice {
  <<interface>>
  +device_id str
  +name str
  +buttons() list~int~
  +start(on_event)
  +stop()
  +supports_grab bool
  +grab()
  +ungrab()
}
class OutputSink {
  <<interface>>
  +send_key(keys)
  +send_mouse(button)
  +type_text(text)
  +launch(target)
}
class ActiveWindowWatcher {
  <<interface>>
  +current() AppContext
  +on_change(cb)
}
class ProfileStore {
  <<interface>>
  +load() Config
  +save(cfg)
}
class Engine {
  +start()
  +stop()
  +reload()
  +set_recording(mode)
}
class ChordResolver {
  +enabled bool
  +window_ms int
  +feed(ev) Trigger
}
class ProfileResolver {
  +resolve(ctx, profiles) Profile
  +binding_for(trig, prof) list~Action~
}
class ActionExecutor {
  +execute(actions, sink)
}
class Recorder {
  +mode RecordMode
  +start(mode)
  +feed(ev)
  +stop() list~Action~
}
class ButtonEvent {
  +device_id str
  +button_id int
  +state ButtonState
  +timestamp float
}
class Trigger {
  +kind TriggerKind
  +device_id str
  +button_ids frozenset~int~
}
class Action {
  +type ActionType
  +params dict
}
class Binding {
  +trigger Trigger
  +actions list~Action~
}
class MatchRule {
  +field MatchField
  +pattern str
}
class Profile {
  +id str
  +name str
  +chords_enabled bool
}
class AppContext {
  +exe str
  +title str
  +bundle_id str
}
class Config {
  +version int
  +default_profile_id str
  +chord_window_ms int
}
class HidPedal
class PynputOutputSink
class WindowsActiveWindow
class NullActiveWindow
class JsonProfileStore
Engine o-- ChordResolver
Engine o-- ProfileResolver
Engine o-- ActionExecutor
Engine o-- Recorder
Engine ..> InputDevice
Engine ..> OutputSink
Engine ..> ActiveWindowWatcher
Engine ..> ProfileStore
ChordResolver ..> ButtonEvent
ChordResolver ..> Trigger
ProfileResolver ..> AppContext
ProfileResolver ..> Profile
ActionExecutor ..> Action
ActionExecutor ..> OutputSink
Profile "1" o-- "*" Binding
Profile "1" o-- "*" MatchRule
Binding *-- Trigger
Binding o-- "*" Action
Config "1" o-- "*" Profile
ProfileStore ..> Config
HidPedal ..|> InputDevice
PynputOutputSink ..|> OutputSink
WindowsActiveWindow ..|> ActiveWindowWatcher
NullActiveWindow ..|> ActiveWindowWatcher
JsonProfileStore ..|> ProfileStore`;
const { svg } = await mermaid.render('uml-svg', src);
document.getElementById('uml').innerHTML = svg;
</script>
